<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15171C" />
<title>WG Kasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171C; --ink2:#1D2027; --ink3:#272B34;
  --paper:#EFEBE2; --line:#C2BAA8; --muted:#8E8778;
  --owe:#C9432C; --get:#2C8A57;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink)}
body{font-family:var(--sans);color:var(--paper);-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
input{font-family:inherit}

.gate-inner{width:100%;max-width:400px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gate-title{font-size:56px;font-weight:700;letter-spacing:-.03em;margin:8px 0 0;line-height:.95}
.gate-title-thin{font-weight:400;color:var(--muted);display:block}
.gate-sub{color:var(--muted);margin:20px 0 14px;font-size:15px}
.gate-list{display:flex;flex-direction:column;gap:10px}
.gate-card{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--ink2);border-left:4px solid var(--c);text-align:left;transition:transform .12s ease,background .12s ease}
.gate-card:hover{background:var(--ink3);transform:translateX(3px)}
.gate-tag{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--c);border:1px solid var(--c);padding:5px 7px;letter-spacing:.05em}
.gate-name{font-size:19px;font-weight:500;flex:1}
.gate-arrow{color:var(--muted)}
.gate-foot{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:20px;letter-spacing:.1em;text-transform:uppercase}
.gate-err{background:var(--ink2);border-left:3px solid var(--owe);padding:14px;font-size:13px;line-height:1.6;color:var(--muted);margin-top:20px}
.gate-err b{color:var(--paper)}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;position:sticky;top:0;background:var(--ink);z-index:5}
.hdr-me{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500}
.hdr-tag{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--c);border:1px solid var(--c);padding:3px 5px}
.hdr-sync{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dot-ok{background:var(--get)}
.dot-bad{background:var(--owe)}

.page{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slip{position:relative;background:var(--paper);color:var(--ink);padding:18px 18px 22px;margin-bottom:26px}
.slip-notch{position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 6px 10px,transparent 6px,var(--paper) 6.5px) repeat-x;background-size:12px 10px}
.slip-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.big{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1}
.big-label{font-size:13px;color:#5C564A;margin-top:6px}
.perf{border-top:2px dashed var(--line);margin:16px -18px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.row-l{color:#3A362E}
.row-r{font-family:var(--mono);font-weight:600;white-space:nowrap}
.get{color:var(--get)}
.owe{color:var(--owe)}
.empty-line{font-size:13px;color:var(--muted)}
.tbl{display:flex;flex-direction:column;gap:11px}
.tr{display:flex;justify-content:space-between;align-items:center}
.td-l{display:flex;flex-direction:column;font-size:15px}
.td-sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.td-r{font-family:var(--mono);font-size:17px;font-weight:600}

.cta-pair{display:flex;gap:10px;margin-bottom:26px}
.cta{flex:1;padding:14px;background:var(--ink2);font-size:14px;font-weight:500;transition:background .12s ease}
.cta:hover{background:var(--ink3)}
.cta-main{background:var(--paper);color:var(--ink);font-weight:600}
.cta-main:hover{background:#fff}
.cta:disabled{opacity:.35;cursor:not-allowed}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-head>span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.link{font-size:12px;color:var(--paper);text-decoration:underline;text-underline-offset:3px}
.feed{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.entry{display:flex;background:var(--ink2);position:relative}
.entry-bar{width:3px;flex-shrink:0}
.entry-body{flex:1;padding:12px 14px}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry-note{font-size:15px;font-weight:500}
.entry-amt{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
.entry-bot{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:12px;color:var(--muted)}
.entry-meta{font-family:var(--mono);white-space:nowrap}
.entry-share{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px;padding-top:5px;border-top:1px solid var(--ink3)}
.entry-author{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:5px;opacity:.75}
.entry-author-warn{color:var(--owe);opacity:1}
.entry-sel{cursor:pointer;user-select:none}
.entry-sel:hover{background:var(--ink3)}
.entry-on{background:var(--ink3);box-shadow:inset 0 0 0 1px var(--paper)}
.entry-box{width:22px;height:22px;flex-shrink:0;align-self:center;margin-left:12px;border:1px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.entry-on .entry-box{border-color:var(--paper);background:var(--paper);color:var(--ink)}
.danger{position:sticky;bottom:60px;background:var(--ink);padding:12px 0 18px;margin-top:-8px}
.danger-txt{font-size:13px;line-height:1.6;color:var(--muted);background:var(--ink2);box-shadow:inset 3px 0 0 var(--owe);padding:13px 14px;margin-bottom:10px}
.danger-txt b{color:var(--paper)}
.entry-del{position:absolute;top:6px;right:8px;font-size:20px;line-height:1;color:var(--muted)}
.entry-del:hover{color:var(--owe)}

.ph{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 0 6px}
.phelp{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.fl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.amt-wrap{display:flex;align-items:center;background:var(--ink2);padding:10px 14px}
.amt-cur{font-family:var(--mono);font-size:26px;color:var(--muted);margin-right:8px}
.amt-input{flex:1;background:none;border:none;outline:none;color:var(--paper);font-family:var(--mono);font-size:32px;font-weight:600;width:100%;padding:4px 0}
.ti{width:100%;background:var(--ink2);border:none;outline:none;color:var(--paper);font-size:15px;padding:14px}
.ti:focus,.amt-wrap:focus-within{box-shadow:inset 0 -2px 0 var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;background:var(--ink2);font-size:13px;color:var(--muted);transition:all .12s ease}
.chip:hover{background:var(--ink3)}
.chip-on{background:var(--ink3);color:var(--paper);box-shadow:inset 0 -2px 0 var(--c,var(--paper))}
.preview{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--ink2);padding:13px 14px;margin:22px 0 18px;line-height:1.6}
.preview b{color:var(--paper)}
.preview-warn{box-shadow:inset 3px 0 0 var(--owe)}
.note{font-size:12px;line-height:1.65;color:#5C564A;background:#E3DED2;box-shadow:inset 3px 0 0 var(--line);padding:11px 13px;margin-top:14px}
.note b{color:var(--ink)}
.note-light{margin:0 0 12px}
.cta-warn{background:var(--owe);color:#fff;font-weight:600}
.cta-warn:hover{background:#B03A26}
.hint{width:100%;text-align:left;font-size:12px;color:var(--muted);background:var(--ink2);padding:11px 14px;margin-top:10px;text-decoration:underline;text-underline-offset:3px}

.nav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;display:flex;background:var(--ink2);border-top:1px solid var(--ink3);padding-bottom:env(safe-area-inset-bottom)}
.nav-b{flex:1;padding:15px 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
.nav-on{color:var(--paper);box-shadow:inset 0 -2px 0 var(--paper)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>

<script type="text/babel" data-type="module">
/* ==================================================================
   Koneksi Supabase. Kalau key dirotate, ganti baris kedua doang.
   ================================================================== */
const SUPABASE_URL = "https://gfywgqsffnbvrourdkds.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_drKcFkCa53PvuQad6GSORg_ZEgU9ZPV";
/* ================================================================== */

const { useState, useEffect, useRef, useCallback } = React;

const configured = SUPABASE_ANON_KEY.length > 20 && SUPABASE_URL.indexOf("https://") === 0;
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let lastError = "";

const PEOPLE = [
  { id: "Daffa", tag: "DF", color: "#E0A32E" },
  { id: "Terrence", tag: "TR", color: "#2FA69B" },
  { id: "Dhafin", tag: "DH", color: "#C4638C" },
];
const CATS = ["Dapur", "Rumah", "Barang", "Nongkrong", "Lain"];
const ME_KEY = "wgkasse.me";

const colorOf = (n) => (PEOPLE.find((p) => p.id === n) || {}).color || "#888";
const tagOf = (n) => (PEOPLE.find((p) => p.id === n) || {}).tag || "??";
const eur = (n) => "€" + Math.abs(n).toFixed(2).replace(".", ",");
const dateLabel = (ts) => new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "short" });

/* ---------- math ---------- */
function computeBalances(entries) {
  const bal = {};
  PEOPLE.forEach((p) => (bal[p.id] = 0));
  entries.forEach((e) => {
    const who = (e.who || []).filter((w) => bal[w] !== undefined);
    if (!who.length || bal[e.payer] === undefined) return;
    const share = e.amount / who.length;
    bal[e.payer] += e.amount;
    who.forEach((w) => (bal[w] -= share));
  });
  return bal;
}

function computePairwise(entries) {
  const m = {};
  PEOPLE.forEach((a) => { m[a.id] = {}; PEOPLE.forEach((b) => (m[a.id][b.id] = 0)); });
  entries.forEach((e) => {
    const who = (e.who || []).filter((w) => m[w]);
    if (!who.length || !m[e.payer]) return;
    const share = e.amount / who.length;
    who.forEach((w) => { if (w !== e.payer) m[w][e.payer] += share; });
  });
  const net = [];
  for (let i = 0; i < PEOPLE.length; i++)
    for (let j = i + 1; j < PEOPLE.length; j++) {
      const a = PEOPLE[i].id, b = PEOPLE[j].id;
      const v = m[a][b] - m[b][a];
      if (Math.abs(v) >= 0.005) net.push(v > 0 ? { from: a, to: b, amount: v } : { from: b, to: a, amount: -v });
    }
  return net;
}

function minimalTransfers(bal) {
  const d = Object.entries(bal).map(([id, v]) => ({ id, v: Math.round(v * 100) / 100 })).filter((x) => Math.abs(x.v) >= 0.005);
  const neg = d.filter((x) => x.v < 0).sort((a, b) => a.v - b.v);
  const pos = d.filter((x) => x.v > 0).sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < neg.length && j < pos.length) {
    const amt = Math.min(-neg[i].v, pos[j].v);
    out.push({ from: neg[i].id, to: pos[j].id, amount: amt });
    neg[i].v += amt; pos[j].v -= amt;
    if (Math.abs(neg[i].v) < 0.005) i++;
    if (Math.abs(pos[j].v) < 0.005) j++;
  }
  return out;
}

/* ---------- app ---------- */
function App() {
  const [me, setMe] = useState(() => { try { return localStorage.getItem(ME_KEY); } catch (e) { return null; } });
  const [entries, setEntries] = useState([]);
  const [view, setView] = useState("home");
  const [status, setStatus] = useState("Menyambung");

  const load = useCallback(async () => {
    if (!db) { setStatus("Belum diset"); return; }
    const { data, error } = await db.from("entries").select("*").order("ts", { ascending: false });
    if (error) { lastError = error.message || String(error); setStatus("Gagal"); console.error(error); return; }
    lastError = "";
    setEntries(data.map((r) => ({ ...r, amount: Number(r.amount) })));
    setStatus("Tersinkron");
  }, []);

  useEffect(() => {
    load();
    if (!db) return;
    const ch = db.channel("entries-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "entries" }, load)
      .subscribe();
    const t = setInterval(load, 30000);
    return () => { db.removeChannel(ch); clearInterval(t); };
  }, [load]);

  const pick = (name) => { try { localStorage.setItem(ME_KEY, name); } catch (e) {} setMe(name); };
  const unpick = () => { try { localStorage.removeItem(ME_KEY); } catch (e) {} setMe(null); };

  const addEntry = async (e) => {
    setEntries((cur) => [e, ...cur]);
    setStatus("Menyimpan");
    const { error } = await db.from("entries").insert(e);
    if (error) { setStatus("Gagal"); console.error(error); }
    else { setStatus("Tersinkron"); load(); }
  };

  const removeMany = async (ids) => {
    if (!ids || !ids.length) return;
    setEntries((cur) => cur.filter((x) => !ids.includes(x.id)));
    setStatus("Menghapus");
    const { error } = await db.from("entries").delete().in("id", ids);
    if (error) { lastError = error.message || String(error); setStatus("Gagal"); load(); }
    else { setStatus("Tersinkron"); load(); }
  };

  const bal = computeBalances(entries);
  const pairs = computePairwise(entries);

  if (!me) return <Gate onPick={pick} status={status} />;

  return (
    <div className="wrap">
      <Header me={me} status={status} onSwitch={unpick} onSync={load} />
      {view === "home" && <Home me={me} bal={bal} pairs={pairs} entries={entries} onGo={setView} />}
      {view === "expense" && <ExpenseForm me={me} onSave={(e) => { addEntry(e); setView("home"); }} onCancel={() => setView("home")} />}
      {view === "payback" && <PaybackForm me={me} pairs={pairs} bal={bal} onSave={(e) => { addEntry(e); setView("home"); }} onCancel={() => setView("home")} />}
      {view === "history" && <History entries={entries} onDeleteMany={removeMany} onBack={() => setView("home")} />}
      {view === "settle" && <Settle bal={bal} pairs={pairs} entries={entries} onBack={() => setView("home")} />}
      <Nav view={view} onGo={setView} />
    </div>
  );
}

function Gate({ onPick, status }) {
  return (
    <div className="gate">
      <div className="gate-inner">
        <div className="eyebrow">Coschützer Str. 25 · Dresden</div>
        <h1 className="gate-title">WG<span className="gate-title-thin">Kasse</span></h1>
        <p className="gate-sub">Siapa yang lagi pegang HP?</p>
        <div className="gate-list">
          {PEOPLE.map((p) => (
            <button key={p.id} className="gate-card" onClick={() => onPick(p.id)} style={{ "--c": p.color }}>
              <span className="gate-tag">{p.tag}</span>
              <span className="gate-name">{p.id}</span>
              <span className="gate-arrow">→</span>
            </button>
          ))}
        </div>
        {status === "Gagal" && (
          <div className="gate-err">
            <b>Ga bisa nyambung ke database.</b><br />{lastError || "Cek koneksi internet."}
          </div>
        )}
        <div className="gate-foot">{status}</div>
      </div>
    </div>
  );
}

function Header({ me, status, onSwitch, onSync }) {
  const cls = status === "Tersinkron" ? "dot dot-ok" : status === "Gagal" ? "dot dot-bad" : "dot";
  return (
    <div className="hdr">
      <button className="hdr-me" onClick={onSwitch} style={{ "--c": colorOf(me) }}>
        <span className="hdr-tag">{tagOf(me)}</span><span>{me}</span>
      </button>
      <button className="hdr-sync" onClick={onSync}><span className={cls} />{status}</button>
    </div>
  );
}

function Home({ me, bal, pairs, entries, onGo }) {
  const net = bal[me] || 0;
  const owedToMe = pairs.filter((p) => p.to === me);
  const iOwe = pairs.filter((p) => p.from === me);
  const totalOwe = iOwe.reduce((s, p) => s + p.amount, 0);
  const totalGet = owedToMe.reduce((s, p) => s + p.amount, 0);
  const clean = totalOwe < 0.005 && totalGet < 0.005;
  const bothWays = totalOwe >= 0.005 && totalGet >= 0.005;

  const hero = totalOwe >= 0.005 ? totalOwe : totalGet;
  const heroColor = clean ? "var(--muted)" : totalOwe >= 0.005 ? "var(--owe)" : "var(--get)";
  const heroLabel = clean
    ? "Aman, ga ada utang piutang"
    : totalOwe >= 0.005
    ? "Yang harus kamu bayar"
    : "Yang harus dibayar ke kamu";

  return (
    <div className="page">
      <div className="slip">
        <div className="slip-head"><span>POSISI KAMU</span><span>{new Date().toLocaleDateString("de-DE")}</span></div>
        <div className="big" style={{ color: heroColor }}>{clean ? "€0,00" : eur(hero)}</div>
        <div className="big-label">{heroLabel}</div>
        <div className="perf" />
        <div className="rows">
          {clean && <div className="empty-line">Belum ada yang perlu ditagih.</div>}
          {iOwe.map((p, i) => (
            <div className="row" key={"b" + i}>
              <span className="row-l">Kamu bayar ke <b style={{ color: colorOf(p.to) }}>{p.to}</b></span>
              <span className="row-r owe">{eur(p.amount)}</span>
            </div>
          ))}
          {owedToMe.map((p, i) => (
            <div className="row" key={"a" + i}>
              <span className="row-l"><b style={{ color: colorOf(p.from) }}>{p.from}</b> bayar ke kamu</span>
              <span className="row-r get">{eur(p.amount)}</span>
            </div>
          ))}
        </div>
        {bothWays && (
          <div className="note">
            Bayar <b>{eur(totalOwe)}</b> penuh, jangan dikurangi duit yang belum kamu terima.
            Selisih bersih kamu {net >= 0 ? "+" : "−"}{eur(net)}, tapi itu cuma hitungan di atas kertas.
          </div>
        )}
        <div className="slip-notch" />
      </div>
      <div className="cta-pair">
        <button className="cta cta-main" onClick={() => onGo("expense")}>Catat nalangin</button>
        <button className="cta" onClick={() => onGo("payback")}>Catat bayar utang</button>
      </div>
      <div className="sec-head"><span>Terakhir masuk</span><button className="link" onClick={() => onGo("history")}>Lihat semua</button></div>
      <div className="feed">
        {entries.length === 0 && <div className="empty-line">Belum ada catatan. Mulai dari tombol di atas.</div>}
        {entries.slice(0, 5).map((e) => <EntryRow key={e.id} e={e} me={me} />)}
      </div>
    </div>
  );
}

function EntryRow({ e, me, selectable, selected, onToggle, showAuthor }) {
  const isPay = e.kind === "payback";
  const who = e.who || [];
  const share = who.includes(me) ? e.amount / who.length : 0;
  const mismatch = e.by_user && e.by_user !== e.payer;
  return (
    <div
      className={"entry" + (selectable ? " entry-sel" : "") + (selected ? " entry-on" : "")}
      onClick={selectable ? () => onToggle(e.id) : undefined}
      role={selectable ? "button" : undefined}
      tabIndex={selectable ? 0 : undefined}
      onKeyDown={selectable ? (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onToggle(e.id); } } : undefined}
    >
      <div className="entry-bar" style={{ background: colorOf(e.payer) }} />
      {selectable && <div className="entry-box">{selected ? "✓" : ""}</div>}
      <div className="entry-body">
        <div className="entry-top">
          <span className="entry-note">{e.note || (isPay ? "Bayar utang" : "Tanpa catatan")}</span>
          <span className="entry-amt">{eur(e.amount)}</span>
        </div>
        <div className="entry-bot">
          <span>
            <b style={{ color: colorOf(e.payer) }}>{e.payer === me ? "Kamu" : e.payer}</b>
            {isPay ? " bayar ke " : " nalangin"}
            {isPay && <b style={{ color: colorOf(who[0]) }}>{who[0] === me ? "kamu" : who[0]}</b>}
            {!isPay && " · dibagi " + who.length}
          </span>
          <span className="entry-meta">{e.cat && !isPay ? e.cat + " · " : ""}{dateLabel(e.ts)}</span>
        </div>
        {!isPay && share > 0 && <div className="entry-share">Bagian kamu {eur(share)}</div>}
        {showAuthor && (
          <div className={"entry-author" + (mismatch ? " entry-author-warn" : "")}>
            {e.by_user ? (mismatch ? "Diinput " + e.by_user + ", bukan " + e.payer : "Diinput " + e.by_user) : "Diinput entah siapa"}
          </div>
        )}
      </div>
    </div>
  );
}

function ExpenseForm({ me, onSave, onCancel }) {
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [cat, setCat] = useState("Dapur");
  const [payer, setPayer] = useState(me);
  const [who, setWho] = useState(PEOPLE.map((p) => p.id));
  const val = parseFloat(String(amount).replace(",", ".")) || 0;
  const ok = val > 0 && who.length > 0;
  const per = who.length ? val / who.length : 0;
  const toggle = (id) => setWho((w) => (w.includes(id) ? w.filter((x) => x !== id) : [...w, id]));
  return (
    <div className="page">
      <h2 className="ph">Catat nalangin</h2>
      <label className="fl">Berapa</label>
      <div className="amt-wrap">
        <span className="amt-cur">€</span>
        <input className="amt-input" inputMode="decimal" placeholder="0,00" value={amount} onChange={(e) => setAmount(e.target.value)} />
      </div>
      <label className="fl">Buat apa</label>
      <input className="ti" placeholder="Contoh: belanja Kaufland" value={note} onChange={(e) => setNote(e.target.value)} />
      <label className="fl">Kategori</label>
      <div className="chips">{CATS.map((c) => <button key={c} className={"chip " + (cat === c ? "chip-on" : "")} onClick={() => setCat(c)}>{c}</button>)}</div>
      <label className="fl">Siapa yang nalangin</label>
      <div className="chips">{PEOPLE.map((p) => <button key={p.id} className={"chip " + (payer === p.id ? "chip-on" : "")} style={payer === p.id ? { "--c": p.color } : {}} onClick={() => setPayer(p.id)}>{p.id === me ? "Kamu" : p.id}</button>)}</div>
      <label className="fl">Dibagi ke siapa</label>
      <div className="chips">{PEOPLE.map((p) => <button key={p.id} className={"chip " + (who.includes(p.id) ? "chip-on" : "")} style={who.includes(p.id) ? { "--c": p.color } : {}} onClick={() => toggle(p.id)}>{who.includes(p.id) ? "✓ " : ""}{p.id}</button>)}</div>
      <div className="preview">{ok ? <>Per orang <b>{eur(per)}</b> · {who.length} orang ikut patungan</> : "Isi jumlahnya dan pilih minimal satu orang."}</div>
      <div className="cta-pair">
        <button className="cta cta-main" disabled={!ok} onClick={() => onSave({
          id: "e" + Date.now() + Math.random().toString(36).slice(2, 6),
          kind: "expense", payer, who, amount: Math.round(val * 100) / 100,
          note: note.trim(), cat, ts: Date.now(), by_user: me,
        })}>Simpan</button>
        <button className="cta" onClick={onCancel}>Batal</button>
      </div>
    </div>
  );
}

function PaybackForm({ me, pairs, bal, onSave, onCancel }) {
  const others = PEOPLE.filter((p) => p.id !== me);
  const [to, setTo] = useState(others[0].id);
  const [amount, setAmount] = useState("");
  const [confirmed, setConfirmed] = useState(false);
  const owed = (pairs.find((p) => p.from === me && p.to === to) || {}).amount || 0;
  const val = parseFloat(String(amount).replace(",", ".")) || 0;
  const after = owed - val;
  const over = val > owed + 0.005;
  const needConfirm = over && val > 0;

  const myNet = Math.abs(bal[me] || 0);
  const netTrap = val > 0 && !over && owed - val > 0.005 && Math.abs(val - myNet) < 0.02 && Math.abs(owed - myNet) > 0.02;

  const pickTo = (id) => { setTo(id); setConfirmed(false); };
  const typeAmt = (v) => { setAmount(v); setConfirmed(false); };

  let preview = null;
  if (val > 0) {
    if (owed < 0.005) {
      preview = <>Kamu <b>ga punya utang</b> ke {to}. Kalau disimpan, {to} yang jadi utang <b>{eur(val)}</b> ke kamu.</>;
    } else if (over) {
      preview = <>Utang kamu ke {to} cuma <b>{eur(owed)}</b>. Kelebihan <b>{eur(val - owed)}</b> bakal balik jadi utang {to} ke kamu.</>;
    } else if (Math.abs(after) < 0.005) {
      preview = <>Pas. Utang kamu ke {to} jadi <b>nol</b>.</>;
    } else if (netTrap) {
      preview = <>Angka ini kayaknya dari selisih bersih kamu, bukan utang ke {to}. Utang kamu ke {to} <b>{eur(owed)}</b>. Kalau cuma bayar {eur(val)}, sisanya <b>{eur(after)}</b> masih nyangkut ke {to} padahal duitnya belum tentu dia terima dari yang lain.</>;
    } else {
      preview = <>Sisa utang kamu ke {to} jadi <b>{eur(after)}</b>.</>;
    }
  }

  return (
    <div className="page">
      <h2 className="ph">Catat bayar utang</h2>
      <p className="phelp">Pakai ini kalau kamu udah transfer atau kasih cash ke salah satu anak WG.</p>
      <label className="fl">Bayar ke siapa</label>
      <div className="chips">{others.map((p) => <button key={p.id} className={"chip " + (to === p.id ? "chip-on" : "")} style={to === p.id ? { "--c": p.color } : {}} onClick={() => pickTo(p.id)}>{p.id}</button>)}</div>
      <label className="fl">Berapa</label>
      <div className="amt-wrap">
        <span className="amt-cur">€</span>
        <input className="amt-input" inputMode="decimal" placeholder="0,00" value={amount} onChange={(e) => typeAmt(e.target.value)} />
      </div>
      {owed >= 0.005
        ? <button className="hint" onClick={() => typeAmt(owed.toFixed(2).replace(".", ","))}>Utang kamu ke {to} sekarang {eur(owed)}. Pakai angka ini</button>
        : <div className="hint" style={{ textDecoration: "none", cursor: "default" }}>Kamu lagi ga punya utang ke {to}.</div>}
      {preview && <div className={"preview " + (needConfirm || netTrap ? "preview-warn" : "")}>{preview}</div>}
      <div className="cta-pair">
        {needConfirm && !confirmed ? (
          <button className="cta cta-warn" onClick={() => setConfirmed(true)}>Gua sadar, ini kelebihan bayar</button>
        ) : (
          <button className="cta cta-main" disabled={val <= 0} onClick={() => onSave({
            id: "p" + Date.now() + Math.random().toString(36).slice(2, 6),
            kind: "payback", payer: me, who: [to], amount: Math.round(val * 100) / 100,
            note: over ? "Bayar utang (lebih)" : "Bayar utang", cat: "", ts: Date.now(), by_user: me,
          })}>Simpan</button>
        )}
        <button className="cta" onClick={onCancel}>Batal</button>
      </div>
    </div>
  );
}

function History({ entries, onDeleteMany, onBack }) {
  const [filter, setFilter] = useState("Semua");
  const [picking, setPicking] = useState(false);
  const [sel, setSel] = useState([]);
  const [confirming, setConfirming] = useState(false);
  const list = filter === "Semua" ? entries : entries.filter((e) => e.payer === filter);
  const total = entries.filter((e) => e.kind === "expense").reduce((s, e) => s + e.amount, 0);
  const selTotal = entries.filter((e) => sel.includes(e.id)).reduce((s, e) => s + e.amount, 0);

  const toggle = (id) => { setConfirming(false); setSel((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id])); };
  const exit = () => { setPicking(false); setSel([]); setConfirming(false); };
  const allShown = list.length > 0 && list.every((e) => sel.includes(e.id));
  const toggleAll = () => { setConfirming(false); setSel(allShown ? [] : list.map((e) => e.id)); };

  return (
    <div className="page">
      <h2 className="ph">Riwayat</h2>
      <div className="phelp">Total pengeluaran WG tercatat <b>{eur(total)}</b> dari {entries.length} catatan.</div>

      <div className="chips">
        {["Semua", ...PEOPLE.map((p) => p.id)].map((f) => (
          <button key={f} className={"chip " + (filter === f ? "chip-on" : "")} onClick={() => { setFilter(f); setConfirming(false); }}>{f}</button>
        ))}
      </div>

      <div className="sec-head" style={{ marginTop: 20 }}>
        <span>{picking ? sel.length + " dipilih" : list.length + " catatan"}</span>
        <span style={{ display: "flex", gap: 14 }}>
          {picking && <button className="link" onClick={toggleAll}>{allShown ? "Batal semua" : "Pilih semua"}</button>}
          <button className="link" onClick={picking ? exit : () => setPicking(true)}>{picking ? "Selesai" : "Pilih"}</button>
        </span>
      </div>

      <div className="feed">
        {list.length === 0 && <div className="empty-line">Kosong.</div>}
        {list.map((e) => (
          <EntryRow key={e.id} e={e} me="__none__" showAuthor
            selectable={picking} selected={sel.includes(e.id)} onToggle={toggle} />
        ))}
      </div>

      {picking && sel.length > 0 && (
        <div className="danger">
          {confirming ? (
            <>
              <div className="danger-txt">Hapus <b>{sel.length}</b> catatan senilai <b>{eur(selTotal)}</b>? Ini permanen dan semua saldo bakal ikut berubah.</div>
              <div className="cta-pair" style={{ marginBottom: 0 }}>
                <button className="cta cta-warn" onClick={() => { onDeleteMany(sel); exit(); }}>Ya, hapus</button>
                <button className="cta" onClick={() => setConfirming(false)}>Batal</button>
              </div>
            </>
          ) : (
            <button className="cta cta-warn" onClick={() => setConfirming(true)}>Hapus {sel.length} catatan ({eur(selTotal)})</button>
          )}
        </div>
      )}
      <button className="cta" onClick={onBack}>Kembali</button>
    </div>
  );
}

function Settle({ bal, pairs, entries, onBack }) {
  const min = minimalTransfers(bal);
  const spend = {};
  PEOPLE.forEach((p) => (spend[p.id] = 0));
  entries.filter((e) => e.kind === "expense").forEach((e) => { if (spend[e.payer] !== undefined) spend[e.payer] += e.amount; });
  return (
    <div className="page">
      <div className="slip">
        <div className="slip-head"><span>PENYELESAIAN</span><span>{new Date().toLocaleDateString("de-DE")}</span></div>
        <div className="tbl">
          {PEOPLE.map((p) => (
            <div className="tr" key={p.id}>
              <span className="td-l"><b style={{ color: p.color }}>{p.id}</b><span className="td-sub">nalangin {eur(spend[p.id])}</span></span>
              <span className={"td-r " + (bal[p.id] >= 0 ? "get" : "owe")}>{bal[p.id] >= 0 ? "+" : "−"}{eur(bal[p.id])}</span>
            </div>
          ))}
        </div>
        <div className="perf" />
        <div className="slip-head"><span>CARA TERCEPAT LUNAS</span><span>{min.length} transfer</span></div>
        {min.length > 0 && (
          <div className="note note-light">
            Ini paket sekali jalan. Semua transfer di bawah harus jalan barengan.
            Kalau cuma sebagian yang bayar, hitungannya jadi ngaco dan ada yang kena nomboki.
            Kalau ga bisa barengan, pakai rincian per pasangan di bawah.
          </div>
        )}
        <div className="rows">
          {min.length === 0 && <div className="empty-line">Semua udah impas.</div>}
          {min.map((t, i) => (
            <div className="row" key={i}>
              <span className="row-l"><b style={{ color: colorOf(t.from) }}>{t.from}</b> → <b style={{ color: colorOf(t.to) }}>{t.to}</b></span>
              <span className="row-r">{eur(t.amount)}</span>
            </div>
          ))}
        </div>
        <div className="perf" />
        <div className="slip-head"><span>RINCIAN PER PASANGAN</span><span>AMAN DICICIL</span></div>
        <div className="rows">
          {pairs.length === 0 && <div className="empty-line">Bersih.</div>}
          {pairs.map((t, i) => (
            <div className="row" key={i}>
              <span className="row-l"><b style={{ color: colorOf(t.from) }}>{t.from}</b> utang ke <b style={{ color: colorOf(t.to) }}>{t.to}</b></span>
              <span className="row-r">{eur(t.amount)}</span>
            </div>
          ))}
        </div>
        <div className="slip-notch" />
      </div>
      <button className="cta" onClick={onBack}>Kembali</button>
    </div>
  );
}

function Nav({ view, onGo }) {
  const items = [{ id: "home", label: "Beranda" }, { id: "history", label: "Riwayat" }, { id: "settle", label: "Lunasin" }];
  return (
    <div className="nav">
      {items.map((i) => <button key={i.id} className={"nav-b " + (view === i.id ? "nav-on" : "")} onClick={() => onGo(i.id)}>{i.label}</button>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
